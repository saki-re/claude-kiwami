/* 表：列の名前を押すと、その順に並べかえ（もう一度押すと逆）。分からない数字はいつも下 */
const nisaShort = f => f.nisa && f.nisa.length ? f.nisa.map(x => /つみたて/.test(x) ? 'つみたて' : '成長').join('・') : (f.nisa ? 'なし' : '—');
const effOf = f => (f.risk && f.risk.p ? f.risk.p['12'] : null);
const TABLE_COLS = [
  {k: 't3', label: '3ヶ月', val: f => rankOf(f, '3'), show: f => rankLabel(f, '3').text, dir: 1},
  {k: 't6', label: '6ヶ月', val: f => rankOf(f, '6'), show: f => rankLabel(f, '6').text, dir: 1},
  {k: 't12', label: '1年', val: f => rankOf(f, '12'), show: f => rankLabel(f, '12').text, dir: 1},
  {k: 't36', label: '3年', val: f => rankOf(f, '36'), show: f => rankLabel(f, '36').text, dir: 1},
  {k: 'r12', label: '1年の増え方', val: f => f.r['12'], show: f => pct1(f.r['12']), dir: -1, color: true},
  {k: 'r36', label: '3年（年率）', val: f => f.r['36'], show: f => pct1(f.r['36']), dir: -1, color: true},
  {k: 'r60', label: '5年（年率）', val: f => f.r['60'], show: f => pct1(f.r['60']), dir: -1, color: true},
  {k: 'rough', label: '荒さ', val: f => { const o = roughOf(f); return o ? o.v : null; },
    show: f => { const o = roughOf(f); return o ? roughShort(o) : '—'; }, dir: 1},
  {k: 'eff', label: '効率', val: effOf, show: f => has(effOf(f)) ? effOf(f).toFixed(2) : '—', dir: -1},
  {k: 'fee', label: '信託報酬', val: f => f.fee, show: f => has(f.fee) ? f.fee + '%' : '—', dir: 1},
  {k: 'rate', label: '評価', val: f => f.rate || null, show: f => f.rate ? '★'.repeat(f.rate) : '—', dir: -1},
  {k: 'nisa', label: 'NISA', val: f => (f.nisa ? f.nisa.length : null), show: nisaShort, dir: -1}];
function renderTable(info) {
  const box = $('#list');
  let rows = info.rows.map((r, i) => ({f: r.f, no: S.tab === 'avg' ? i + 1 : r.rank}));
  const col = S.sort && TABLE_COLS.find(c => c.k === S.sort.k);
  if (col) {
    const d = S.sort.d;
    rows = rows.slice().sort((a, b) => {
      const x = col.val(a.f), y = col.val(b.f);
      if (!has(x) || !has(y)) return (has(x) ? -1 : has(y) ? 1 : 0) || a.no - b.no;
      return (x - y) * d || a.no - b.no;
    });
  }
  const head = h('tr', null,
    h('th', {class: 'no'}, h('button', {type: 'button', 'aria-label': 'もとの順にもどす', onclick: () => { S.sort = null; keep(); renderList(); }},
      '順', col ? '' : ' ▲')),
    h('th', {class: 'nm2'}, '名前'),
    TABLE_COLS.map(c => {
      const on = !!(col && col.k === c.k);
      return h('th', {'data-col': c.k, 'aria-sort': on ? (S.sort.d > 0 ? 'ascending' : 'descending') : null},
        h('button', {type: 'button', onclick: () => { S.sort = {k: c.k, d: on ? -S.sort.d : c.dir}; keep(); renderList(); }},
          c.label, on ? (S.sort.d > 0 ? ' ▲' : ' ▼') : ''));
    }));
  const body = rows.map(({f, no}) => h('tr', {'data-id': f.id, class: S.sel === f.id ? 'on' : null, onclick: () => selectFund(f.id)},
    h('td', {class: 'no'}, no),
    h('td', {class: 'nm2'}, h('div', {class: 'n'}, (S.stars.has(f.id) ? '♥ ' : '') + f.name), h('div', {class: 'sub'}, f.co || '')),
    TABLE_COLS.map(c => {
      const v = c.val(f);
      return h('td', {class: !has(v) ? 'na' : c.color ? (v >= 0 ? 'up' : 'down') : null}, c.show(f));
    })));
  const tab = TLABEL[S.tab] + (S.tab === 'avg' ? '（' + S.avg.map(k => TLABEL[k]).join('・') + '）' : '');
  box.replaceChildren(
    h('div', {class: 'print-head'}, '投資信託ランキング｜' + tab + '｜' + $('#asof').textContent + '｜' + isoDay(new Date()) + ' 印刷'),
    h('div', {class: 'tablewrap'}, h('table', {class: 'grid', id: 'grid'}, h('thead', null, head), h('tbody', null, body))),
    h('div', {class: 'hint tnote'}, '列の名前を押すと、その順に並びます（もう一度押すと逆）。「順」で元の並び。荒さの「約」は目安です。'));
}

/* 地図：横＝値動きの荒さ（1年）、縦＝1年の増え方。斜めの点線が効率1（これより上は、荒さの割によく増えた）。
   いま一覧に出ているファンド（絞り込み・タブが効く）のうち、荒さが分かるものだけ。はみ出す点は端に寄せて点線の輪を付ける */
function renderMap(info) {
  const box = $('#list');
  const pts = info.rows.map(r => {
    const o = roughOf(r.f, '12');
    return o && has(r.f.r['12']) ? {f: r.f, x: o.v, est: o.est, y: r.f.r['12']} : null;
  }).filter(Boolean);
  if (!pts.length) {
    box.replaceChildren(h('div', {class: 'empty'}, '地図に出せるファンドがありません。荒さ（または効率）と1年の増え方がそろったファンドだけが出ます。'
      + '取り込みの面の「まとめて取る」で比較のページを取り込むと入ります。'));
    return;
  }
  const W = Math.max(300, Math.min(1100, (box.clientWidth || 360) - 26)), H = Math.round(Math.min(480, Math.max(300, W * 0.75)));
  const m = {l: 48, r: 12, t: 24, b: 30};
  const qt = (arr, q) => { const z = arr.slice().sort((a, b) => a - b); return z[Math.round(q * (z.length - 1))]; };
  const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
  const xHi = Math.max(25, Math.ceil(qt(xs, 0.95) * 1.15 / 5) * 5);
  const yLo = Math.min(0, Math.floor(qt(ys, 0.02) / 10) * 10), yHi = Math.max(10, Math.ceil(qt(ys, 0.97) * 1.1 / 10) * 10);
  const X = v => m.l + Math.max(0, Math.min(v, xHi)) / xHi * (W - m.l - m.r);
  const Y = v => m.t + (yHi - Math.max(yLo, Math.min(yHi, v))) / (yHi - yLo) * (H - m.t - m.b);
  const svg = sv('svg', {viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': '値動きの荒さと1年の増え方の地図', id: 'map'});
  const text = (x, y, str, attrs) => { const t = sv('text', Object.assign({x, y, 'font-size': 11, fill: 'var(--mute)'}, attrs || {})); t.textContent = str; return t; };
  /* 荒さの帯は1色の濃淡（右ほど濃い）。期間の色とは混ぜない */
  for (const [a, b, label, op] of [[0, 10, 'おだやか', 0.02], [10, 20, 'ふつう', 0.05], [20, 35, '荒め', 0.09], [35, 1e9, 'とても荒い', 0.14]]) {
    if (a >= xHi) continue;
    const x0 = X(a), x1 = X(Math.min(b, xHi));
    svg.append(sv('rect', {x: x0, y: m.t, width: Math.max(0, x1 - x0), height: H - m.t - m.b, fill: '#b9a5ff', 'fill-opacity': op}));
    if (x1 - x0 >= label.length * 11 + 4) svg.append(text((x0 + x1) / 2, m.t - 8, label, {'text-anchor': 'middle', fill: 'var(--ink2)', 'font-weight': 700}));
  }
  const step = (span, list) => list.find(s => span / s <= 6) || list[list.length - 1];
  const ys0 = step(yHi - yLo, [5, 10, 20, 25, 50, 100, 200, 500]);
  for (let v = Math.ceil(yLo / ys0) * ys0; v <= yHi; v += ys0) {
    svg.append(sv('line', {x1: m.l, x2: W - m.r, y1: Y(v), y2: Y(v), stroke: v === 0 ? 'var(--axis)' : 'var(--line)', 'stroke-width': v === 0 ? 1.5 : 1}));
    svg.append(text(m.l - 6, Y(v) + 4, (v > 0 ? '+' : '') + v + '%', {'text-anchor': 'end'}));
  }
  const xs0 = step(xHi, [5, 10, 20, 50]);
  for (let v = 0; v <= xHi; v += xs0) svg.append(text(X(v), H - m.b + 16, v + '%', {'text-anchor': 'middle'}));
  /* 効率1の線（増え方＝荒さ）。この線より上のファンドは、荒さの割によく増えた */
  const t1 = Math.min(xHi, yHi);
  if (yLo <= 0) {
    svg.append(sv('line', {x1: X(0), y1: Y(0), x2: X(t1), y2: Y(t1), stroke: 'var(--ink2)', 'stroke-width': 1.5, 'stroke-dasharray': '6 5'}));
    svg.append(text(X(t1) - 4, Y(t1) + 14, '効率1', {'text-anchor': 'end', fill: 'var(--ink2)'}));
  }
  const color = f => S.stars.has(f.id) ? 'var(--heart)' : f.lev ? 'var(--t6)' : 'var(--accent)';
  const ordered = pts.slice().sort((a, b) => (S.stars.has(a.f.id) ? 1 : 0) - (S.stars.has(b.f.id) ? 1 : 0) || (a.f.id === S.mapSel) - (b.f.id === S.mapSel));
  for (const p of ordered) {
    const cx = X(p.x), cy = Y(p.y), on = p.f.id === S.mapSel, star = S.stars.has(p.f.id);
    const out = p.x > xHi || p.y > yHi || p.y < yLo;
    const g = sv('g', {class: 'pt', 'data-id': p.f.id, tabindex: '0', role: 'button', 'aria-label': p.f.name});
    g.append(sv('circle', {cx, cy, r: 13, fill: 'transparent'}));
    if (out) g.append(sv('circle', {cx, cy, r: 9, fill: 'none', stroke: color(p.f), 'stroke-dasharray': '2 2'}));
    g.append(sv('circle', {cx, cy, r: on ? 7.5 : star ? 6.5 : 5, fill: color(p.f), 'fill-opacity': on ? 1 : 0.85,
      stroke: on ? '#fff' : 'var(--card)', 'stroke-width': on ? 2.5 : 1.5}));
    g.addEventListener('keydown', e => { if (e.key === 'Enter') { S.mapSel = p.f.id; renderList(); } });
    svg.append(g);
  }
  /* 指で押したときは、押した所にいちばん近い点（点が重なっていても選べるように） */
  svg.addEventListener('click', e => {
    const r = svg.getBoundingClientRect(), k = W / r.width;
    const px = (e.clientX - r.left) * k, py = (e.clientY - r.top) * k;
    let best = null;
    for (const p of pts) { const d = Math.hypot(X(p.x) - px, Y(p.y) - py); if (!best || d < best.d) best = {p, d}; }
    if (best && best.d <= 40) { S.mapSel = best.p.f.id; renderList(); }
  });
  const key = (c, label, cls) => { const i = h('i', {class: cls || 'dot'}); if (!cls) i.style.background = c; return h('span', null, i, label); };
  const sp = pts.find(p => p.f.id === S.mapSel);
  /* 選んだ点のすぐ近くにある点（重なって押しにくいもの）を3本まで */
  const nearOf = c => {
    const near = pts.filter(p => p !== c).map(p => ({p, d: Math.hypot(X(p.x) - X(c.x), Y(p.y) - Y(c.y))}))
      .filter(x => x.d <= 26).sort((a, b) => a.d - b.d).slice(0, 3);
    return near.length ? h('div', {class: 'near'}, h('span', {class: 'hint'}, 'すぐ近くの点'), near.map(({p}) =>
      h('button', {class: 'chip', type: 'button', onclick: () => { S.mapSel = p.f.id; renderList(); }}, p.f.name))) : null;
  };
  const card = sp ? h('div', {class: 'mapcard', id: 'map-card'},
    h('div', {class: 's'}, h('b', null, sp.f.name), h('br'),
      '荒さ ' + roughShort({v: sp.x, est: sp.est}) + '（' + roughWord(sp.x) + '）・1年 ' + pct1(sp.y)
        + (has(effOf(sp.f)) ? '・効率 ' + effOf(sp.f).toFixed(2) : '')
        + (sp.x > xHi || sp.y > yHi || sp.y < yLo ? '（地図の端に寄せています）' : '')),
    h('button', {class: 'btn main', type: 'button', onclick: () => selectFund(sp.f.id)}, 'くわしく見る'),
    nearOf(sp))
    : h('div', {class: 'hint', id: 'map-card'}, '点を押すと、ファンドの名前と数字が出ます。');
  box.replaceChildren(h('div', {class: 'mapbox'}, svg,
    h('div', {class: 'legend'}, key('var(--accent)', 'ファンド'), key('var(--heart)', '♡'), key('var(--t6)', '2倍・3倍型'),
      key(null, '効率1の線（これより上は、荒さの割によく増えた）', 'dash')),
    card,
    h('div', {class: 'hint'}, '縦＝1年の増え方・横＝値動きの荒さ（1年）。' + info.rows.length + '本のうち、荒さが分かる ' + pts.length
      + '本。荒さの多くは目安（増え方÷効率）です。同じ高さなら、左（おだやか）ほど安心して持てます。')));
}

/* 今月の動き：期間ごとに、ひとつ前の月の並びとくらべる（サーバーの moves と、ファンドごとの mv） */
function openMoves() {
  const d = S.data, byId = new Map(d.funds.map(f => [f.id, f]));
  const rowOf = (f, mark, cls, sub, name) => f
    ? h('div', {class: 'mvrow', role: 'button', tabindex: '0', 'data-id': f.id, onclick: () => openFrom(f.id),
      onkeydown: e => { if (e.key === 'Enter') openFrom(f.id); }},
      h('span', {class: 'd ' + cls}, mark), h('span', {class: 'n'}, f.name), h('span', {class: 'r'}, sub))
    : h('div', {class: 'mvrow off'}, h('span', {class: 'd ' + cls}, mark), h('span', {class: 'n'}, name || ''), h('span', {class: 'r'}, sub));
  const boxOf = (title, rows, none) => h('div', {class: 'mvbox'}, h('h4', null, title), rows.length ? rows : h('div', {class: 'hint'}, none));
  const secs = TERMS.map(([k, label]) => {
    const mm = (d.moves || {})[k];
    const c = d.coverage[k] || {};
    if (!mm) {
      return h('div', {class: 'mvsec', 'data-term': k}, h('h3', null, label),
        h('div', {class: 'hint'}, covAny(k) ? 'くらべる前の月がまだありません（いまは' + (c.months || 1) + 'か月ぶん）。来月の取り込みで出ます。' : 'まだ取り込んでいません。'));
    }
    const ups = d.funds.filter(f => (f.mv || {})[k] > 0).sort((a, b) => b.mv[k] - a.mv[k]).slice(0, 5);
    const downs = d.funds.filter(f => (f.mv || {})[k] < 0).sort((a, b) => a.mv[k] - b.mv[k]).slice(0, 5);
    if (!ups.length && !downs.length && !mm.in.length && !mm.out.length) {
      return h('div', {class: 'mvsec', 'data-term': k}, h('h3', null, label + '：' + ym(mm.prev) + '末 → ' + ym(mm.date) + '末'),
        h('div', {class: 'hint'}, '先月と同じ並びでした（上位' + mm.depth + '位まで）。'));
    }
    return h('div', {class: 'mvsec', 'data-term': k},
      h('h3', null, label + '：' + ym(mm.prev) + '末 → ' + ym(mm.date) + '末'),
      h('div', {class: 'mvgrid'},
        boxOf('上がってきた', ups.map(f => rowOf(f, '↑' + f.mv[k], 'up', 'いま' + f.t[k] + '位')), '上がったファンドはありません。'),
        boxOf('新しく上位' + mm.depth + '位に入った', mm.in.slice(0, 10).map(([id, rk]) => rowOf(byId.get(id), '入', 'up', rk + '位', id)), 'ありません。'),
        boxOf('上位' + mm.depth + '位から外れた', mm.out.slice(0, 10).map(([id, prev, name, now]) =>
          rowOf(byId.get(id), '外', 'down', '前' + prev + '位 → ' + (now ? now + '位' : '圏外'), name)), 'ありません。'),
        boxOf('下がった', downs.map(f => rowOf(f, '↓' + -f.mv[k], 'down', 'いま' + f.t[k] + '位')), '下がったファンドはありません。')));
  });
  openSheet('moves', '今月の動き', [
    h('p', {class: 'hint'}, 'ひとつ前の月の並びとくらべました。順位は月ごとに入れかわるので、1か月の上下だけでなく、何か月も続いているか'
      + '（くわしい面の「常連」「続けて下がっている」の印）も見る、という見方もあります。'),
    ...secs]);
}

/* ブックマークで取り込めたら、つぎのページを自動で開く（取り込みと次のページを開くのを、1回で済ませるため）。
   開くだけで、読むのは今までどおり、持ち主がそのページで「取り込む」を押したとき。
   貼り付け・古いタブ・古いブックマークのときは開かない（知らせを読んでもらうため）。
   今のページを置き換えて移る（ブラウザの戻るで、この画面を挟まずに前のみんかぶのページへ戻れるように）。 */
function goNextSoon(out) {
  if (out.bad !== undefined || out.old || out.stale) return;
  const msg = $('#banner .msg');
  if (!msg) return;
  let next = null;
  if (chainOn()) {
    /* おまかせ：みんかぶがまだ新しい月になっていなければ止める。全部済んだら知らせて終わる */
    if (out.kind === 'rank' && out.date < needMonth()) {
      setChain(false);
      msg.append(h('div', {class: 'hint', id: 'chain-wait'}, 'みんかぶが、まだ ' + ym(needMonth()) + ' 末までの成績になっていないようです。'
        + '少しあとで、取り込みの面の「はじめる」をもう一度押してください。'));
      return;
    }
    const st = chainSteps();
    if (!st.length) {
      setChain(false);
      msg.append(h('div', {class: 'hint', id: 'chain-done'}, '今月ぶんは、全部取り込めました🎉 おつかれさまでした。'));
      return;
    }
    next = {url: st[0].url, label: st[0].label + '（あと' + st.length + '回）'};
  } else {
    if (!S.autoNext || !lastNext) return;
    next = lastNext;
  }
  const note = h('div', {class: 'hint', id: 'next-soon'}, 'つづけて「' + next.label + '」へ進みます… ',
    h('button', {class: 'btn', type: 'button', onclick: () => { clearTimeout(nextTimer); setChain(false); note.remove(); }}, '止める'));
  msg.append(note);
  nextTimer = setTimeout(() => location.replace(next.url), NEXT_WAIT);
}

/* ---- 今月ぶんをまとめて取る（おまかせ）----
   毎月1日に、1回押すだけで今月ぶんをまとめて取れるようにするためのボタン。
   「はじめる」で、3ヶ月→6ヶ月→1年→3年のランキング（S.depth 位まで）→ まとめて取る（比較のページ）の順に、まだのページを
   1枚ずつ開く。読むのは今までどおり、持ち主がそのページで「取り込む」を押したとき。
   続きの印は localStorage の toushin-chain。全部済むか「止める」で消える */
const DEPTHS = [60, 100, 200, 300];
const needMonth = () => { const n = new Date(); return isoDay(new Date(n.getFullYear(), n.getMonth(), 0)); };
const chainOn = () => { try { return localStorage.getItem('toushin-chain') === '1'; } catch (e) { return false; } };
function setChain(on) { try { if (on) localStorage.setItem('toushin-chain', '1'); else localStorage.removeItem('toushin-chain'); } catch (e) {} }
/* まだのページ（今月の成績の月で、S.depth 位まで切れ目なく入っていない期間のつづき → 印のファンドの比較のページ） */
function chainSteps() {
  const d = S.data, need = needMonth(), steps = [];
  for (const [k, label] of TERMS) {
    const c = d.coverage[k] || {};
    const upto = c.date && c.date >= need ? c.upto : 0;
    for (let p = Math.floor(upto / PAGE) + 1; p <= S.depth / PAGE; p++) {
      steps.push({url: rankUrl(k, p), label: label + 'の' + ((p - 1) * PAGE + 1) + '〜' + (p * PAGE) + '位', rank: true});
    }
  }
  chunksOf(chainPicks()).forEach(ids => steps.push({url: compareUrl(ids), label: 'まとめて取る（' + ids.length + '本）', rank: false}));
  return steps;
}
/* おまかせで比較のページに並べるのは、いまの平均の上位 AUTO_PICK 本と♡のうち、今月の成績の月をまだ取っていないもの */
function chainPicks() {
  const d = S.data;
  const want = [...new Set([...listRows('avg', true, AUTO_PICK).rows.map(r => r.f.id), ...S.stars])];
  return want.filter(id => !d.period || (d.taken || {})[id] !== d.period);
}
/* Google ドライブから自動で入れている様子（別のPCで取ったデータ。8050 が5分ごとに見る） */
function dropLine() {
  const dr = S.data.drop;
  if (!dr) return null;
  const l = dr.last;
  return h('p', {class: 'hint', id: 'drop-line'}, !dr.seen ? 'Google ドライブ（' + dr.dir + '）が見えません。'
    : l && l.ok ? 'Google ドライブのファイルからも自動で入れています（最後：' + md(l.at) + ' ' + l.at.slice(11, 16) + '・' + l.file + '・' + l.funds + '本）。'
      : l ? 'Google ドライブの「' + l.file + '」は読めませんでした（' + (l.why || '') + '）。ファイルを置き直すと、読み直します。'
        : '別のPCで取ったデータを Google ドライブに「投資信託_….json」で置くと、5分以内に自動で入ります。');
}
function chainBlock() {
  const d = S.data, st = chainSteps(), need = needMonth();
  const nRank = st.filter(x => x.rank).length;
  /* まだ新しい月のランキングを入れていないうちは、まとめて取るの回数は「印の本数÷1回の本数」で見積もる */
  const stale = !d.period || d.period < need;
  const cmpEst = Math.ceil((AUTO_PICK + S.stars.size) / S.chunk);
  const nCmp = stale && nRank ? cmpEst : st.length - nRank;
  const go = st[0];
  return h('div', {class: 'sect chain', id: 'chain'},
    h('h3', null, '今月ぶんをまとめて取る（おまかせ）'),
    go ? h('p', {class: 'hint'}, '「はじめる」を押すと、みんかぶのページが順に開きます。開いたページで、ブックマークの「',
      h('b', {class: 'bm-name'}, '取り込む'), '」を押すだけ。取り込めたら、次のページが自動で開きます。あと' + (nRank + nCmp)
      + '回くらい（ランキング' + nRank + '回・まとめて取る' + nCmp + '回）。')
      : h('p', {class: 'hint', id: 'chain-none'}, (d.period ? ym(d.period) + ' 末までの成績は、' : '') + '全部取り込めています。来月の1日ごろ、またここから。'),
    h('div', {class: 'filters'}, h('span', {class: 'hint'}, 'ランキングは'), DEPTHS.map(n => h('button', {class: 'chip', type: 'button',
      'data-depth': String(n), 'aria-pressed': String(S.depth === n), onclick: () => { S.depth = n; keep(); openImport(); }},
      n + '位まで（月に約' + (4 * n / PAGE + cmpEst) + '回）'))),
    go ? h('a', {class: 'btn main chain-go', id: 'chain-go', href: go.url, onclick: () => setChain(true)},
      (chainOn() ? 'つづきから' : 'はじめる') + '（' + go.label + '）') : null,
    go || jidou.running ? h('button', {class: 'btn chain-go', type: 'button', id: 'jidou-go', disabled: jidou.running || null,
      onclick: () => jidouStart()}, jidou.running ? '自動で取っています…' : '自動で取る（ブックマークなし・' + S.depth + '位まで）') : null,
    h('p', {class: 'hint', id: 'jidou-line', hidden: !jidou.last || null}, jidou.last || ''));
}

/* 自動で取る：8050 が jidou_torikomi.py を裏で回す（見えない Edge で、上の「はじめる」と同じページを順に取り込む）。
   iPhone から押して、閉じても続く */
async function jidouStart() {
  const out = await api('/api/jidou', {depth: S.depth});
  if (out) Object.assign(jidou, out);
  clearTimeout(jidou.timer);
  jidou.timer = null;
  openImport();
}
async function jidouWatch() {
  clearTimeout(jidou.timer);
  jidou.timer = -1;
  const out = await api('/api/jidou');
  if (!out) { jidou.timer = null; return; }
  const was = jidou.running;
  Object.assign(jidou, out);
  const line = $('#jidou-line'), btn = $('#jidou-go');
  if (line) { line.textContent = out.last || ''; line.hidden = !out.last; }
  if (btn && !out.running) { btn.disabled = false; btn.textContent = '自動で取る（ブックマークなし・' + S.depth + '位まで）'; }
  jidou.timer = out.running ? setTimeout(jidouWatch, 3000) : null;
  if (!out.running && was) { await load(); openImport(); }
}

/* 写した中身をサーバーへ渡す。返すのは、入った結果か {bad: 入らなかった理由} */
async function sendImport(payload) {
  try {
    const res = await fetch('/api/import', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(payload)});
    const out = await res.json();
    return res.ok ? out : {bad: out.detail || ''};
  } catch (e) { return {bad: 'この画面のサーバーに届きませんでした。'}; }
}

/* ブックマークの「取り込む」から、住所の # に載って渡ってきた分 */
async function takeHash() {
  if (location.pathname !== '/torikomi') return null;
  const raw = location.hash.slice(1);
  history.replaceState(null, '', '/');
  if (!raw) return null;
  let payload;
  try { payload = JSON.parse(decodeURIComponent(raw)); } catch (e) { return {bad: '渡された中身が読めませんでした。'}; }
  return sendImport(payload);
}

/* コピーして貼った分。読み方はブックマークと同じ（/extract.js）。
   貼られた HTML は DOMParser で読むだけで、画面には入れない（中の script は動かず、画像なども読みに行かない）。 */
function fromPaste(html) {
  if (!html) return {bad: 'コピーした中身に、ページの形が入っていませんでした。みんかぶのページの上で Ctrl+A → Ctrl+C をやり直してください。'};
  if (!window.toushinExtract) return {bad: '読み取りの部品を読み込めていません。この画面を開き直してください。'};
  const doc = new DOMParser().parseFromString(html, 'text/html');
  const txt = e => e ? e.textContent.replace(/\s+/g, ' ').trim() : '';
  const isFund = [...doc.querySelectorAll('table')].some(t => {
    const heads = [...t.rows].map(r => txt(r.cells[0]));
    return heads.includes('期間') && heads.includes('リターン');
  });
  const isCompare = [...doc.querySelectorAll('table')].some(t => {
    const heads = [...t.rows].map(r => txt(r.cells[0]).replace(/\s/g, ''));
    return heads.includes('ファンド') && heads.includes('シャープレシオ');
  });
  if (isCompare) {
    const rc = window.toushinExtract(doc, {hostname: 'itf.minkabu.jp', pathname: '/fund/compare', search: ''}, true);
    return rc.a ? {bad: rc.a.replace(/で押してください/g, 'をコピーしてください')} : {payload: rc.d};
  }
  let path = '/ranking/return';
  if (!isFund && !doc.querySelector('input[id="fund_ids"]')) {
    return {bad: 'みんかぶのランキングか、ファンドの「リターン」のページをコピーして貼ってください（ページの上を1回クリックしてから Ctrl+A → Ctrl+C）。'};
  }
  if (isFund) {
    const count = {};
    for (const a of doc.querySelectorAll('a[href]')) {
      const m = a.getAttribute('href').match(/\/fund\/([0-9A-Za-z]{8})(?:\/|$)/);
      if (m) count[m[1]] = (count[m[1]] || 0) + 1;
    }
    const id = Object.keys(count).sort((a, b) => count[b] - count[a])[0];
    if (!id || count[id] < 2) return {bad: 'どのファンドのページかが読めませんでした。ページの上で Ctrl+A → Ctrl+C をやり直してください。'};
    path = '/fund/' + id + '/return';
  } else {
    /* NISA のランキングは、いつものランキングと同じ作りなので、見出し（h1）で見分ける */
    const h1 = txt(doc.querySelector('h1'));
    if (/NISA/.test(h1)) path = /つみたて/.test(h1) ? '/ranking/yield_nisa' : '/ranking/yield_nisa_growth';
  }
  const r = window.toushinExtract(doc, {hostname: 'itf.minkabu.jp', pathname: path, search: ''}, true);
  if (r.d && r.d.kind === 'nisa') r.d.pasted = true;      /* 貼り付けでは何ページ目か分からないので、「次を開く」は出さない */
  return r.a ? {bad: r.a.replace(/で押してください/g, 'をコピーしてください')} : {payload: r.d};
}

async function onPaste(e) {
  const t = e.target;
  if (t && t.id === 'f-q') return;                 /* 「名前でさがす」への貼り付けは、そのまま */
  const html = e.clipboardData ? e.clipboardData.getData('text/html') : '';
  if (!html && !(t && t.id === 'paste-box')) return;
  e.preventDefault();
  const got = fromPaste(html);
  const out = got.bad !== undefined ? {bad: got.bad} : await sendImport(got.payload);
  if (pushed) history.back(); else $('#imp').hidden = true;
  await applyResult(out);
  window.scrollTo(0, 0);
}

/* 取り込んだ結果を画面に映す（どちらの入れ方でも同じ） */
async function applyResult(out) {
  if (out.bad === undefined && out.kind !== 'compare' && out.kind !== 'nisa') {
    if (out.kind === 'rank') S.tab = String(out.term);
    else {
      S.tab = 'star';
      /* くわしい面をすぐ開くのは PC の幅だけ（iPhone の幅では画面いっぱいに開いて、「取り込めました」が隠れるため） */
      S.sel = narrow() ? null : out.id;
    }
    keep();
  }
  await load();
  showResult(out);
  if (S.sel) selectFund(S.sel);
}

function showResult(out) {
  if (out.bad !== undefined) { banner('取り込めませんでした：' + out.bad, null, true); return; }
  if (out.old) {
    /* 入ったけれど、ブックマークの中身が古い（比較のページなど、あとから足した読み方が入っていない） */
    const r = Object.assign({}, out, {old: false});
    showResult(r);
    const msg = $('#banner .msg');
    if (msg) msg.append(h('div', {class: 'hint'}, 'ブックマークの「取り込む」が古いままです。取り込みの面の「はじめの1回・入れ直し」から入れ直すと、あとから足したページ（NISA のランキングなど）も読めます。'));
    return;
  }
  if (out.kind === 'nisa') {
    banner('取り込めました：' + out.n + '本に「' + out.label + '」の NISA の印を付けました（' + (out.page || 1) + 'ページ目）。',
      out.next ? {url: out.next.url, label: out.next.first + '〜' + out.next.last + '位を開く'} : null);
    return;
  }
  if (out.kind === 'compare') {
    const rest = S.data ? remainingPicks() : [];
    const next = rest.slice(0, S.chunk);
    const short = out.asked && out.n < out.asked
      ? '（' + out.asked + '本のうち' + out.n + '本。比較のページは1回に' + out.n + '本までのようです。残りは次で入ります）' : '';
    banner('取り込めました：比較のページから' + out.n + '本（1年・3年・5年のリターンと効率' + (out.info ? '・なりたち' : '') + '）' + short
      + (rest.length ? '。印のファンドは、あと' + rest.length + '本です。' : '。印のファンドは、ぜんぶ取り込み済みです。'),
      next.length ? {url: compareUrl(next), label: '次の' + next.length + '本を開く'} : null);
    return;
  }
  if (out.kind === 'rank' && out.stale) {
    banner('このページは古い成績' + (out.span ? '（' + out.span.replace('~', '〜') + '）' : '') + 'でした。みんかぶはもう '
      + ym(out.stale) + ' 末までの成績に変わっています。下のボタンでページを開き直して、もう一度「取り込む」を押してください。',
      {url: out.next.url, label: 'このページを開き直す'}, true);
    return;
  }
  if (out.kind === 'rank') {
    banner('取り込めました：' + TLABEL[String(out.term)] + ' ' + out.first + '〜' + out.last + '位（' + out.n + '件）'
      + (out.span ? '・' + out.span.replace('~', '〜') + ' の成績' : ''),
      out.next ? {url: out.next.url, label: out.next.first + '〜' + out.next.last + '位を開く'} : null);
    return;
  }
  const next = S.data && S.data.funds.find(f => S.stars.has(f.id) && f.id !== out.id && S.data.page_dates[f.id] !== out.date);
  banner('取り込めました：' + out.name + '（' + out.terms.map(t => TLABEL[String(t)] || (t / 12 + '年')).join('・') + 'のリターン）。♡に入れました。',
    next ? {url: MK + '/fund/' + next.id + '/return', label: '次の♡を開く'} : null);
}

$('#btn-imp').addEventListener('click', openImport);
$('#f-lev').addEventListener('click', () => { S.noLev = !S.noLev; keep(); render(); });
$('#f-fee').addEventListener('click', () => { S.lowFee = !S.lowFee; keep(); render(); });
$('#f-nisa').addEventListener('click', () => { S.onlyNisa = !S.onlyNisa; keep(); render(); });
$('#f-rough').addEventListener('click', () => { S.lowRough = !S.lowRough; keep(); render(); });
$('#f-eff').addEventListener('click', () => { S.effOne = !S.effOne; keep(); render(); });
$('#f-star4').addEventListener('click', () => { S.star4 = !S.star4; keep(); render(); });
[...document.querySelectorAll('.chipsrow .chip')].forEach((c, i) => { c.dataset.i = String(i); });
$('#f-star').addEventListener('click', () => { S.onlyStar = !S.onlyStar; render(); });
$('#f-q').addEventListener('input', e => { S.q = e.target.value; renderList(); });
/* 幅が変わったときだけグラフを描き直す（iPhone は、スクロールで住所の帯が出入りするだけでも resize が来る） */
let lastWidth = window.innerWidth;
window.addEventListener('resize', () => {
  if (window.innerWidth === lastWidth) return;
  lastWidth = window.innerWidth;
  if (S.hist && S.hist.length > 1) renderChart();
  if (S.view === 'map' && S.data) renderList();
});

document.addEventListener('paste', onPaste);
/* 読み方（torikomi.js）を、この画面用に読み込む。旗を立てておくと、画面を移らずに読み方だけを置いていく */
window.__TOUSHIN_PAGE__ = true;
document.head.append(h('script', {src: '/extract.js'}));

/* 新しい月の成績がまだ入っていなければ、「更新の時期です」を出す。
   みんかぶは毎月1日には前の月の末までの成績に切り替わるので、いちばん新しい成績の月が前の月の末日より前なら、その時期。
   「あとで」はその日だけ閉じる（次の日に開くと、また出る）。取り込めば出なくなる。 */
function isoDay(d) {
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
function maybeNudge() {
  const d = S.data;
  if (!d || !d.period) return;                 /* まだ何も無いときは、空の画面の案内に任せる */
  const now = new Date();
  const need = isoDay(new Date(now.getFullYear(), now.getMonth(), 0));
  if (d.period >= need) return;
  let later = null;
  try { later = localStorage.getItem('toushin-nudge-later'); } catch (e) {}
  if (later === isoDay(now)) return;
  $('#nudge-text').textContent = 'みんかぶの成績が ' + ym(need) + ' 末までに変わっています。いま入っているのは ' + ym(d.period)
    + ' 末までです。「取り込む」を押して、いちばん上の「はじめる」から。開いたページでブックマークを押すだけで、次々に進みます。';
  $('#nudge').hidden = false;
}
$('#nudge-go').addEventListener('click', () => { $('#nudge').hidden = true; openImport(); });
$('#nudge-later').addEventListener('click', () => {
  $('#nudge').hidden = true;
  try { localStorage.setItem('toushin-nudge-later', isoDay(new Date())); } catch (e) {}
});

(async () => {
  /* みんかぶから戻ってきて Safari が読み直したときは、見ていた面を開き直す。
     履歴にこの画面の面の印（history.state.panel）が残っていれば、履歴は足さずにその印を使う
     （足すと「一覧」の履歴が2つ並び、戻るが1回空振りするため）。印が無いのに #f= が付いている住所から開いたときだけ、足し直す。 */
  const st = history.state && history.state.panel ? history.state.panel : null;
  const opened = location.hash.startsWith('#f=') ? location.hash.slice(3) : null;
  const impOpen = location.hash === '#imp';
  const moreKind = location.hash === '#help' ? 'help' : location.hash === '#moves' ? 'moves' : null;
  if (location.pathname !== '/torikomi') {
    if (st && (opened || impOpen || moreKind)) pushed = st;
    else if (location.hash) history.replaceState(null, '', '/');
  }
  const out = await takeHash();
  if (out) { await applyResult(out); goNextSoon(out); return; }
  await load();
  if (opened && S.data && S.data.funds.some(f => f.id === opened)) selectFund(opened);
  else if (impOpen && pushed) openImport();
  else if (moreKind && pushed) (moreKind === 'help' ? openHelp : openMoves)();
  else {
    if (pushed) { pushed = null; history.replaceState(null, '', '/'); }
    maybeNudge();
  }
})();
